<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <title>Gezelle Visualisaties</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        h1 { color: #2c3e50; margin-bottom: 10px; }
        
        .header-links { margin-bottom: 30px; }
        .btn-manual {
            background-color: #34495e;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-manual:hover { background-color: #2c3e50; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .card:hover { transform: translateY(-5px); }

        .viz-link {
            background-color: #3498db;
            color: white;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .viz-link:hover { background-color: #2980b9; }

        .meta-info {
            font-size: 0.85em;
            color: #7f8c8d;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 5px;
        }

        .commit-msg { color: #27ae60; font-style: italic; }

        .sub-manual {
            margin-top: 10px;
            font-size: 0.9em;
            color: #2980b9;
            text-decoration: none;
            text-align: center;
            border: 1px solid #3498db;
            padding: 5px;
            border-radius: 4px;
        }
        .sub-manual:hover { background: #eaf2f8; }
    </style>
</head>
